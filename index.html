<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capítulo – Biblioteca de livros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <div class="marca">📖 <span>Capítulo</span></div>
  <nav class="menu">
    <a href="#inicio">Início</a>
    <a href="#colecao">Livros</a>
    <a href="#categorias">Categorias</a>
    <a href="cadastro.html" class="menu-cadastrar">Cadastrar</a>
  </nav>
</header>

<section id="inicio" class="hero">
  <div class="hero-texto">
    <h1>Encontre sua<br>próxima história.</h1>
    <p>Uma pequena biblioteca para guardar os livros que você já leu, está lendo ou ainda vai conhecer.</p>
    <a href="#colecao" class="btn-primario">Ver coleção</a>
  </div>
  <div class="hero-capas" aria-hidden="true">
    <div class="capa-flutuante c1">Dom Casmurro</div>
    <div class="capa-flutuante c2">O Hobbit</div>
    <div class="capa-flutuante c3">Harry Potter</div>
  </div>
</section>

<section class="busca-area">
  <div class="busca-caixa">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
    </svg>
    <input type="search" id="busca" placeholder="Pesquisar por título ou autor...">
  </div>
</section>

<section id="categorias" class="categorias">
  <h2>Categorias</h2>
  <div class="categorias-botoes" id="categorias-botoes">
    <button type="button" data-categoria="" class="ativa">Todas</button>
    <button type="button" data-categoria="Ficção">Ficção</button>
    <button type="button" data-categoria="Romance">Romance</button>
    <button type="button" data-categoria="Fantasia">Fantasia</button>
    <button type="button" data-categoria="Mistério">Mistério</button>
    <button type="button" data-categoria="Desenvolvimento pessoal">Desenvolvimento pessoal</button>
    <button type="button" data-categoria="Clássicos">Clássicos</button>
  </div>
</section>

<section id="colecao" class="colecao">
  <div class="colecao-topo">
    <h2>Nossa coleção</h2>
    <span id="contador" class="contador"></span>
  </div>

  <div class="livros-grid" id="lista-livros"></div>
  <p id="vazio" class="vazio" hidden>Nenhum livro encontrado para essa busca.</p>

  <button type="button" id="btn-limpar" class="btn-discreto">Limpar biblioteca</button>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
